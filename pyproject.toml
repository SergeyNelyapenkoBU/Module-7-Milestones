[project]
name = "bu-advanced-ml"
version = "0.1.0"
description = "Boston University - Advanced ML and AI Coursework"
requires-python = ">=3.9,<3.12"
dependencies = [
    # Core ML/DL frameworks (from homework imports)
    "scikit-learn>=1.3.0",
    "tensorflow==2.17.0",  # Pinned for tensorflow-metal compatibility
    "tensorflow-metal==1.1.0",  # Metal GPU support for M4 Pro
    # Data manipulation and analysis
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    # Visualization
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    # Jupyter environment
    "jupyter>=1.0.0",
    "ipykernel>=6.25.0",
    # Dataset utilities
    "kagglehub>=0.2.0",
    # NLP (Homework 6)
    "spacy>=3.7.0",
    "nltk>=3.8.0",
    # Hugging Face
    "datasets>=2.14.0",
    # Imbalanced learning
    "imbalanced-learn>=0.11.0",
    "transformers<5",
    "tf-keras>=2.17.0",
    "huggingface-hub<0.28",
]

[project.optional-dependencies]
dev = [
    "black>=23.0.0",  # Code formatting
    "ruff>=0.1.0",    # Linting
    "pytest>=7.4.0",  # Testing
]

[dependency-groups]
dev = []
